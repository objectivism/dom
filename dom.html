<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كويز: شرح DOM في JavaScript</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #34495e;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #ecf0f1;
            border: 2px solid transparent;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
            font-family: inherit;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #d5d8dc;
        }

        .option-btn.correct {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        .option-btn.wrong {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-size: 15px;
            display: none;
            line-height: 1.5;
        }

        .feedback.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .next-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background-color 0.3s;
            font-family: inherit;
        }

        .next-btn:hover {
            background-color: #2980b9;
        }

        .progress {
            font-size: 14px;
            color: #7f8c8d;
            text-align: left;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="progress" id="progress">السؤال 1 من 5</div>
        <h1>اختبار الـ DOM (JavaScript)</h1>
        <div class="question" id="question-text">جاري التحميل...</div>
        <div class="options" id="options-container"></div>
        <div class="feedback" id="feedback-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي</button>
    </div>

    <script>
        // هنا قمنا بتخزين الأسئلة والأجوبة بناءً على محتوى الملف
        const quizData = [
            {
                question: "ما هو الـ DOM في لغة JavaScript؟",
                options: [
                    "لغة برمجة جديدة لتصميم الصفحات",
                    "تمثيل شجري (Tree) لصفحة الويب يمكن التحكم به بواسطة JavaScript",
                    "قاعدة بيانات لتخزين نصوص صفحة HTML",
                    "برنامج لتصفح الإنترنت"
                ],
                correct: 1,
                explanation: "الـ DOM هو تمثيل برمجي (شجري) لصفحة الويب، يسمح للغة JavaScript بالوصول إلى عناصر HTML وتعديلها."
            },
            {
                question: "أي دالة نستخدمها لجلب (التقاط) عنصر HTML بناءً على الـ ID الخاص به؟",
                options: [
                    "document.querySelector()",
                    "document.getElementByClass()",
                    "document.getElementById()",
                    "document.getTagName()"
                ],
                correct: 2,
                explanation: "الدالة document.getElementById('id') تُرجع عنصراً واحداً بناءً على الـ ID، وتُرجع null إذا لم تجده."
            },
            {
                question: "ما الفرق بين استخدام خاصية innerHTML و textContent عند تعديل عنصر؟",
                options: [
                    "لا يوجد أي فرق بينهما",
                    "innerHTML يقرأ النص فقط، بينما textContent يقرأ النص والوسوم",
                    "innerHTML يقرأ النص والوسوم (HTML)، بينما textContent يقرأ النص فقط",
                    "textContent لا يمكن استخدامه في JavaScript"
                ],
                correct: 2,
                explanation: "innerHTML يتعامل مع الكود كـ HTML (يشمل الوسوم)، بينما textContent يتعامل مع النص المجرد فقط ويتجاهل الوسوم."
            },
            {
                question: "عند تغيير خاصية CSS مثل (background-color) باستخدام JavaScript، كيف يجب أن نكتبها؟",
                options: [
                    "element.style.background-color",
                    "element.style.backgroundColor",
                    "element.style.background_color",
                    "element.style.bgColor"
                ],
                correct: 1,
                explanation: "في JavaScript، لا يمكن استخدام الشرطة (-) في أسماء الخصائص. نستخدم نظام CamelCase، لذا تصبح background-color إلى backgroundColor."
            },
            {
                question: "ما هي الطريقة الأفضل والموصى بها في الملف للتعامل مع الأحداث (Events)؟",
                options: [
                    "استخدام خصائص HTML مثل onclick=\"function()\"",
                    "استخدام خصائص JavaScript مثل element.onclick",
                    "استخدام الدالة addEventListener()",
                    "استخدام وسم <event> داخل الـ HTML"
                ],
                correct: 2,
                explanation: "الدالة addEventListener() هي الطريقة الموصى بها لأنها تفصل الكود وتسمح بربط أكثر من حدث واحد لنفس العنصر."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const feedbackBox = document.getElementById("feedback-box");
        const nextBtn = document.getElementById("next-btn");
        const progress = document.getElementById("progress");

        function loadQuestion() {
            // تصفير الحالة
            feedbackBox.style.display = "none";
            nextBtn.style.display = "none";
            optionsContainer.innerHTML = "";
            
            const currentData = quizData[currentQuestionIndex];
            progress.innerText = `السؤال ${currentQuestionIndex + 1} من ${quizData.length}`;
            questionText.innerText = currentData.question;

            // إنشاء الأزرار للخيارات
            currentData.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => checkAnswer(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex, selectedButton) {
            const currentData = quizData[currentQuestionIndex];
            const allButtons = document.querySelectorAll(".option-btn");
            
            // تعطيل جميع الأزرار بعد الاختيار
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentData.correct) {
                // إجابة صحيحة
                selectedButton.classList.add("correct");
                feedbackBox.className = "feedback success";
                feedbackBox.innerHTML = `<strong>إجابة صحيحة! 🎉</strong><br>${currentData.explanation}`;
                score++;
            } else {
                // إجابة خاطئة
                selectedButton.classList.add("wrong");
                // إظهار الإجابة الصحيحة
                allButtons[currentData.correct].classList.add("correct");
                feedbackBox.className = "feedback error";
                feedbackBox.innerHTML = `<strong>إجابة خاطئة ❌</strong><br>الإجابة الصحيحة هي: <b>${currentData.options[currentData.correct]}</b><br><br>${currentData.explanation}`;
            }

            feedbackBox.style.display = "block";
            nextBtn.style.display = "block";

            // تغيير نص الزر إذا كان هذا آخر سؤال
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.innerText = "عرض النتيجة النهائية";
            } else {
                nextBtn.innerText = "السؤال التالي";
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            let message = "";
            if (score === quizData.length) {
                message = "ممتاز! لقد فهمت الـ DOM تماماً 🌟";
            } else if (score >= 3) {
                message = "عمل رائع! مستواك جيد جداً 👍";
            } else {
                message = "لا بأس، راجع الملف وحاول مرة أخرى 💪";
            }

            questionText.innerHTML = `<div style="text-align:center;">
                <h2>انتهى الاختبار!</h2>
                <p style="font-size: 24px; margin: 20px 0;">نتيجتك: ${score} من ${quizData.length}</p>
                <p>${message}</p>
            </div>`;
            
            optionsContainer.innerHTML = "";
            feedbackBox.style.display = "none";
            progress.style.display = "none";
            
            // إعادة تعيين الزر ليقوم بإعادة الاختبار
            nextBtn.innerText = "إعادة الاختبار";
            nextBtn.style.display = "block";
            nextBtn.onclick = () => {
                currentQuestionIndex = 0;
                score = 0;
                progress.style.display = "block";
                nextBtn.onclick = nextQuestion; // إعادة ربط الدالة الأصلية
                loadQuestion();
            };
        }

        // بدء الاختبار عند تحميل الصفحة
        loadQuestion();
    </script>
</body>
</html>
